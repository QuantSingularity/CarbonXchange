version: "3.9"

# CarbonXchange local development stack
# Usage:
#   docker compose up                  # start all services
#   docker compose up -d               # start detached
#   docker compose --profile tools up  # start with DB admin tools
#   docker compose down -v             # stop and remove volumes

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &restart-policy
  restart: unless-stopped

services:
  # ------------------------------------------------------------
  # DATABASE
  # ------------------------------------------------------------
  # The backend depends on psycopg2-binary, so it requires PostgreSQL.
  # See code/backend/requirements.txt and code/backend/init.sql.
  database:
    image: postgres:15-alpine
    container_name: carbonxchange-database
    <<: *restart-policy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carbonxchange}
      POSTGRES_USER: ${POSTGRES_USER:-carbonxchange}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-db-password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../code/backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-carbonxchange} -d ${POSTGRES_DB:-carbonxchange}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend-net
    logging: *default-logging

  # ------------------------------------------------------------
  # REDIS
  # ------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: carbonxchange-redis
    <<: *restart-policy
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-dev-redis-password}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-dev-redis-password}",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend-net
    logging: *default-logging

  # ------------------------------------------------------------
  # BACKEND
  # ------------------------------------------------------------
  backend:
    build:
      context: ../code/backend
      dockerfile: ../../infrastructure/docker/Dockerfile.backend
      target: runtime
    image: carbonxchange-backend:dev
    container_name: carbonxchange-backend
    <<: *restart-policy
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FLASK_ENV: development
      PORT: "5000"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-carbonxchange}:${POSTGRES_PASSWORD:-dev-db-password}@database:5432/${POSTGRES_DB:-carbonxchange}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-dev-redis-password}@redis:6379/0"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-32chars}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-change-in-production-32ch}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      CORS_ORIGINS: "http://localhost:3001,http://frontend:80"
      FEATURE_BLOCKCHAIN_INTEGRATION: ${FEATURE_BLOCKCHAIN_INTEGRATION:-false}
      WEB3_PROVIDER_URL: ${WEB3_PROVIDER_URL:-}
      WEB3_PRIVATE_KEY: ${WEB3_PRIVATE_KEY:-}
      WEB3_CHAIN_ID: ${WEB3_CHAIN_ID:-137}
      CARBON_TOKEN_CONTRACT_ADDRESS: ${CARBON_TOKEN_CONTRACT_ADDRESS:-}
      MARKETPLACE_CONTRACT_ADDRESS: ${MARKETPLACE_CONTRACT_ADDRESS:-}
      PAYMENT_TOKEN_CONTRACT_ADDRESS: ${PAYMENT_TOKEN_CONTRACT_ADDRESS:-}
      CONTRACT_ABI_DIR: ${CONTRACT_ABI_DIR:-/app/contracts_abi}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - /tmp:/tmp
    networks:
      - backend-net
      - frontend-net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ------------------------------------------------------------
  # FRONTEND
  # ------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.frontend
      target: runtime
      args:
        VITE_API_URL: /api
        VITE_APP_ENV: development
    image: carbonxchange-frontend:dev
    container_name: carbonxchange-frontend
    <<: *restart-policy
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:80"
    networks:
      - frontend-net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------
  # NGINX REVERSE PROXY (dev gateway)
  # ------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: carbonxchange-nginx
    <<: *restart-policy
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-net
      - backend-net
    logging: *default-logging

  # ------------------------------------------------------------
  # OPTIONAL TOOLS (start with: docker compose --profile tools up)
  # ------------------------------------------------------------
  adminer:
    image: adminer:4
    container_name: carbonxchange-adminer
    profiles: [tools]
    <<: *restart-policy
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8888:8080"
    networks:
      - backend-net
    logging: *default-logging

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: carbonxchange-redis-commander
    profiles: [tools]
    <<: *restart-policy
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOSTS: "local:redis:6379:0:${REDIS_PASSWORD:-dev-redis-password}"
    ports:
      - "127.0.0.1:8889:8081"
    networks:
      - backend-net
    logging: *default-logging

networks:
  backend-net:
    driver: bridge
    internal: false
  frontend-net:
    driver: bridge

volumes:
  db-data:
    driver: local
  redis-data:
    driver: local
