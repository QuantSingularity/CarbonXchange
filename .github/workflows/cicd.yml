name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks (Python & Prettier)
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .
          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Global Formatters
        run: npm install -g prettier prettier-plugin-solidity

      - name: Run Global Prettier Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

  # ============================================================
  # Job 2 -- Smart Contract Compile & Test (Truffle / Solidity)
  # ============================================================
  contracts_test:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: code/blockchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/blockchain/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Compile contracts
        run: npx truffle compile

      - name: Start Ganache
        run: |
          npx ganache \
            --host 127.0.0.1 \
            --port 8545 \
            --wallet.totalAccounts 10 \
            --wallet.defaultBalance 10000 \
            --miner.blockGasLimit 30000000 \
            > ganache.log 2>&1 &

      - name: Wait for Ganache
        run: |
          for i in {1..30}; do
            if curl -s -X POST \
              -H "Content-Type: application/json" \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              http://127.0.0.1:8545 > /dev/null; then
              echo "Ganache is ready."
              exit 0
            fi
            sleep 1
          done

          echo "Ganache failed to start."
          cat ganache.log
          exit 1

      - name: Run contract test suite
        run: |
          mkdir -p test-results
          npx truffle test \
            --reporter mocha-junit-reporter \
            --reporter-options mochaFile=./test-results/contracts-junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-results
          path: code/blockchain/test-results/
          retention-days: 30

      - name: Upload compiled contract artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: contract-build-artifacts
          path: code/blockchain/build/contracts/
          retention-days: 7

      - name: Upload Ganache log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ganache-log
          path: code/blockchain/ganache.log
          retention-days: 7

  # ============================================================
  # Job 3 -- Backend Tests (Python / Pytest)
  # ============================================================
  backend_tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: code_quality

    env:
      BACKEND_DIR: code/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "${BACKEND_DIR}/requirements.txt" ]; then
            python -m pip install -r "${BACKEND_DIR}/requirements.txt"
          fi
          python -m pip install pytest pytest-cov pytest-asyncio

      - name: Run backend test suite
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: code/backend/coverage.xml
          retention-days: 30

  # ==========================
  # Job 4 -- Backend Build
  # ==========================
  backend_build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend_tests

    env:
      IMAGE_TAG: carbonxchange-backend:ci
      CONTAINER_NAME: carbonxchange-backend-smoke

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: code
          file: code/backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Verify image contents
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python "${IMAGE_TAG}" -c \
            "import ai_models, gevent, gunicorn; print('ai_models', ai_models.__version__)"
          docker run --rm --entrypoint sh "${IMAGE_TAG}" -c \
            "test -w /app/ai_models/models && test -w /app/logs"

      - name: Start container
        run: |
          set -euo pipefail
          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p 127.0.0.1:5000:5000 \
            -e SECRET_KEY="$(openssl rand -hex 32)" \
            -e JWT_SECRET_KEY="$(openssl rand -hex 32)" \
            -e WEB3_PRIVATE_KEY="0x$(openssl rand -hex 32)" \
            -e DATABASE_URL="sqlite:////tmp/ci.db" \
            -e CARBON_TOKEN_CONTRACT_ADDRESS=0x0000000000000000000000000000000000000001 \
            -e MARKETPLACE_CONTRACT_ADDRESS=0x0000000000000000000000000000000000000002 \
            -e PAYMENT_TOKEN_CONTRACT_ADDRESS=0x0000000000000000000000000000000000000003 \
            "${IMAGE_TAG}"

      - name: Wait for health check
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/api/health > /dev/null; then
              echo "Backend is healthy."
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "${CONTAINER_NAME}")" != "true" ]; then
              break
            fi
            sleep 2
          done
          echo "Backend failed to become healthy."
          exit 1

      - name: Verify forecast API is registered
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/api/forecast/status)
          if [ "${status}" != "401" ]; then
            echo "Expected 401 from the unauthenticated forecast status route, got ${status}."
            exit 1
          fi

      - name: Show container logs
        if: failure()
        run: |
          docker logs "${CONTAINER_NAME}" || true
          docker exec "${CONTAINER_NAME}" sh -c "tail -n 100 /app/logs/error.log" || true

      - name: Stop container
        if: always()
        run: docker rm -f "${CONTAINER_NAME}" || true

  # ============================================================
  # Job 5 -- Web Frontend Test & Build
  # ============================================================
  web-frontend_test_and_build:
    name: Web-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: web-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: CI=true npm test

      - name: Build web-frontend
        run: CI=false npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web-frontend/dist/
          retention-days: 7
