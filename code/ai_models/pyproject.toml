[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end to end tests that run the training command line tools",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["models", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"training_scripts/*" = ["E402", "F401"]
